[flake8]
# Complements pyproject.toml, which flake8 does not read.
max-line-length = 120
max-complexity = 10
exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    build,
    dist,
    models
# E203 conflicts with Black-style slicing; W503 with line breaks before binary
# operators. Both are standard to disable.
extend-ignore = E203, W503
per-file-ignores =
    tests/*:S101