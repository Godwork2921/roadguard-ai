# =============================================================================
# RoadGuard AI - development overlay
# =============================================================================
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Optimises for fast feedback: source bind-mounts, hot reload, debug ports,
# verbose logging, no resource ceilings.
# =============================================================================

services:
  postgres:
    ports:
      # Host access for psql / DBeaver / PostGIS inspection.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - max_connections=200
      - -c
      - log_min_duration_statement=500   # surface slow queries
      - -c
      - log_statement=none

  redis:
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy noeviction
      --loglevel notice

  kafka:
    environment:
      # Auto-created topics are convenient locally; production should provision
      # them explicitly (see docs/architecture/event-driven-architecture.md).
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_NUM_PARTITIONS: ${KAFKA_NUM_PARTITIONS:-3}

  keycloak:
    command: start-dev --import-realm
    environment:
      KC_LOG_LEVEL: INFO
      KC_SPI_LOGIN_REQUIRED_ACTIONS: ""

  roadguard-api:
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      SPRING_PROFILES_ACTIVE: default
      # Show SQL to make debugging migrations and queries practical.
      SPRING_JPA_SHOW_SQL: "true"
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      JAVA_OPTS: "-XX:MaxRAMPercentage=75 -XX:+UseContainerSupport -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
    ports:
      # 8080 app, 5005 JVM debugger
      - "${BACKEND_HOST_PORT:-8080}:${SERVER_PORT:-8080}"
      - "5005:5005"
    # The JAR is compiled at image build time. Spring Boot DevTools (a
    # dependency in development scope) restarts the JVM in-process on
    # classpath change, but source is NOT bind-mounted here: a bind mount over
    # /app would shadow the compiled classes without recompiling them.
    #
    # For genuine hot reload of Java source, run the backend on the host:
    #   cd backend/roadguard-api && mvn spring-boot:run
    # See README.md ("Running the backend on the host").

  ai-service:
    environment:
      LOG_LEVEL: ${AI_LOG_LEVEL:-DEBUG}
      # Reload on source changes.
      WATCHFILES_DIR: /app
      RELOAD: "true"
    volumes:
      - ./apps/ai/ai-service/app:/app/app
      - ./apps/ai/ai-service/tests:/app/tests
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app/app

  nginx:
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"