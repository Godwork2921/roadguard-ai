# =============================================================================
# RoadGuard AI - production overlay
# =============================================================================
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Differences from the base stack:
#   - TLS vhost (requires certificates, see infrastructure/ssl/README.md)
#   - no published database/cache/broker ports; reachable only on the network
#   - resource limits and log rotation on every long-running service
#   - read-only root filesystems where the image permits
#   - no source bind mounts
#
# Requires a populated .env with real secrets. Validate first with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
# =============================================================================

services:
  postgres:
    # No host port binding: the database is not exposed outside the network.
    ports: !reset []
    environment:
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/scripts/init-db.sh:/docker-entrypoint-initdb.d/10-init-db.sh:ro
    deploy:
      resources:
        limits:
          memory: 4G
    logging: &default-logging
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    ports: !reset []
    command: >
      redis-server
      --appendonly yes
      --maxmemory 2gb
      --maxmemory-policy noeviction
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in production}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in production}
    deploy:
      resources:
        limits:
          memory: 3G
    logging: *default-logging

  kafka:
    ports: !reset []
    environment:
      # No silent topic creation in production: topics are provisioned
      # explicitly so that partitions and retention are deliberate.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_NUM_PARTITIONS: ${KAFKA_NUM_PARTITIONS:-3}
    deploy:
      resources:
        limits:
          memory: 4G
    logging: *default-logging

  keycloak:
    ports: !reset []
    # start (not start-dev) + explicit hostname: the token issuer must match
    # what the resource server validates, or every JWT fails verification.
    command: start --optimized --import-realm
    environment:
      KC_HOSTNAME: https://${KEYCLOAK_PUBLIC_URL:-roadguard.ai}
      KC_HOSTNAME_STRICT: "true"
      KC_HTTP_ENABLED: "false"
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?KEYCLOAK_ADMIN must be set}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD must be set}
    deploy:
      resources:
        limits:
          memory: 2G
    logging: *default-logging

  minio:
    ports: !reset []
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
      MINIO_BROWSER: "off"
    deploy:
      resources:
        limits:
          memory: 4G
    logging: *default-logging

  minio-init:
    restart: "no"

  roadguard-api:
    restart: always
    # Must be removed, not emptied: a fixed container name is incompatible with
    # deploy.replicas, because replicas require unique container names.
    container_name: !reset
    environment:
      SPRING_PROFILES_ACTIVE: prod
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Fail fast if a secret was left unset rather than booting insecurely.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in production}
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 2G
    logging: *default-logging

  ai-service:
    restart: always
    deploy:
      resources:
        limits:
          memory: 4G
    logging: *default-logging

  nginx:
    # Production serves the compiled SPA from a named image rather than a host
    # bind mount, so the artifact is immutable and versioned with the deploy.
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/roadguard.https.conf:/etc/nginx/conf.d/roadguard.conf:ro
      - ./apps/web/authority-dashboard/dist:/usr/share/nginx/html:ro
      - ./infrastructure/ssl:/etc/nginx/ssl:ro
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *default-logging

  prometheus:
    logging: *default-logging

  grafana:
    logging: *default-logging

  loki:
    logging: *default-logging

  tempo:
    logging: *default-logging

  otel-collector:
    logging: *default-logging