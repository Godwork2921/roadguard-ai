name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/frontend.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: ./apps/web/authority-dashboard

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/authority-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        # TODO(Phase 11): no ESLint config exists in the repo yet, so this step
        # is skipped rather than failing. Re-enable when eslint.config.js lands.
        run: |
          if [ -f eslint.config.js ] || [ -f .eslintrc.cjs ]; then
            npm run lint
          else
            echo "::notice::No ESLint config found - skipping lint"
          fi

      - name: Run type check
        run: npx tsc --noEmit

      - name: Run unit tests
        # TODO(Phase 14): no test runner is configured yet. Vitest + React
        # Testing Library + Playwright land in the testing phase.
        run: |
          if npm run | grep -qE '^  test'; then
            npm test -- --run
          else
            echo "::notice::No test script defined - skipping tests"
          fi

      - name: Build frontend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: authority-dashboard-dist
          path: apps/web/authority-dashboard/dist
          retention-days: 3

      - name: Notify on failure
        if: failure() && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            github.rest.issues.create({
              owner,
              repo,
              title: 'Frontend CI Failure',
              body: 'Frontend CI pipeline failed on main. [View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})'
            });