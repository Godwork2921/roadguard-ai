name: AI Service CI

on:
  push:
    branches: [main]
    paths:
      - "apps/ai/ai-service/**"
      - ".github/workflows/ai-service.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/ai/ai-service/**"
      - ".github/workflows/ai-service.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: ./apps/ai/ai-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('apps/ai/ai-service/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8 mypy

      # Settings live in pyproject.toml / setup.cfg so local runs and CI agree.
      - name: Run linting
        run: flake8 . --count --statistics

      - name: Run type checks
        run: mypy app/

      - name: Run tests with pytest
        run: |
          python -m pytest tests/ \
            -v \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-service-test-results
          path: apps/ai/ai-service/test-results.xml
          retention-days: 3

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: ai-service-coverage
          path: apps/ai/ai-service/coverage.xml
          retention-days: 3

      - name: Notify on failure
        if: failure() && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            github.rest.issues.create({
              owner,
              repo,
              title: 'AI Service CI Failure',
              body: 'AI Service CI pipeline failed on main. [View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})'
            });