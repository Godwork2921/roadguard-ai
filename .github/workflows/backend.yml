name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "database/**"
      - "infrastructure/scripts/init-db.sh"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "database/**"
      - "infrastructure/scripts/init-db.sh"
      - ".github/workflows/backend.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must be >= <java.version> in backend/roadguard-api/pom.xml (currently 24),
  # otherwise `mvn package` fails on the release bytecode.
  JAVA_VERSION: "24"
  MAVEN_OPTS: "-Xmx2g -XX:+TieredCompilation -XX:TieredStopAtLevel=1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: roadguard_test
          POSTGRES_USER: roadguard
          POSTGRES_PASSWORD: roadguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U roadguard -d roadguard_test
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

      # TODO(Phase 8): add a Kafka service and integration tests covering
      # outbox publishing and idempotent consumers.
      # TODO(Phase 4): add a Keycloak service and OIDC token-validation tests.

    defaults:
      run:
        # pom.xml lives in the module directory, not in backend/.
        working-directory: ./backend/roadguard-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/roadguard-api/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Verify
        run: mvn verify -B
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: roadguard_test
          DB_USER: roadguard
          DB_PASSWORD: roadguard
          REDIS_HOST: localhost
          REDIS_PORT: "6379"

      - name: Package
        run: mvn package -DskipTests -B

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: roadguard-api
          path: backend/roadguard-api/target/roadguard-api-*.jar
          retention-days: 3

      - name: Notify on failure
        if: failure() && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            github.rest.issues.create({
              owner,
              repo,
              title: 'Backend CI Failure',
              body: 'Backend CI pipeline failed on main. [View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})'
            });