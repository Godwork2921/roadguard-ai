# =============================================================================
# RoadGuard AI - HTTPS vhost (production only)
# =============================================================================
# Mounted by docker-compose.prod.yml in place of roadguard.conf.
#
# PREREQUISITE: infrastructure/ssl/roadguard.crt and roadguard.key must exist.
# nginx exits immediately if a referenced certificate is missing.
# See infrastructure/ssl/README.md.
#
# This file repeats the location blocks from roadguard.conf rather than
# including it: an `ssl` server block cannot share a server block with a
# non-TLS one, and an included file would re-declare the plain-HTTP listener.
# Keep the two files in sync when changing routes.
# =============================================================================

# Redirect everything to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name roadguard.ai www.roadguard.ai;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name roadguard.ai www.roadguard.ai;

    ssl_certificate     /etc/nginx/ssl/roadguard.crt;
    ssl_certificate_key /etc/nginx/ssl/roadguard.key;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;

    # --- API -----------------------------------------------------------------
    # No trailing slash: preserves the /api prefix for the backend controllers.
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://roadguard-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location /actuator {
        return 404;
    }

    # --- WebSocket -----------------------------------------------------------
    location /ws {
        proxy_pass http://roadguard-api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # --- SPA -----------------------------------------------------------------
    location / {
        limit_req zone=static burst=50 nodelay;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        log_not_found off;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ^/(\.env|\.git|node_modules|config) {
        deny all;
        access_log off;
        log_not_found off;
    }

    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
}