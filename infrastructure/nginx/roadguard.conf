# =============================================================================
# RoadGuard AI - HTTP vhost (development / base stack)
# =============================================================================
# This file deliberately serves plain HTTP only. TLS lives in
# roadguard.https.conf, which is mounted by docker-compose.prod.yml.
#
# Reason: an `ssl` server block makes nginx fail to start when the referenced
# certificate is missing, which would take down the whole proxy. Dev and CI
# have no certificate, so TLS must not be in the default vhost.
#
# See infrastructure/ssl/README.md for how to provision certificates.
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- API reverse proxy ---------------------------------------------------
    # NOTE: no trailing slash and no URI part on proxy_pass. Both forms would
    # strip the matched `location` prefix, turning /api/v1/hazards into
    # /v1/hazards and 404-ing every controller (they are mapped to /api/v1/*).
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://roadguard-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Hazard image uploads can be large and slow on mobile networks.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # CORS preflight must bypass the rate limiter, otherwise a burst of
    # preflights trips the api zone and blocks the real request that follows.
    location = /api {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT, User-Agent, X-Requested-With, Content-Type, Authorization, X-Idempotency-Key" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
        proxy_pass http://roadguard-api;
    }

    # --- Actuator: never expose metrics or env to the public -----------------
    location /actuator {
        return 404;
    }

    # --- WebSocket / STOMP (Phase 9) ----------------------------------------
    location /ws {
        proxy_pass http://roadguard-api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # --- SPA -----------------------------------------------------------------
    location / {
        limit_req zone=static burst=50 nodelay;
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed filenames, so these are safe to cache forever.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        log_not_found off;
    }

    location ~* \.(json|xml)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # --- Hardening -----------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ^/(\.env|\.git|node_modules|config) {
        deny all;
        access_log off;
        log_not_found off;
    }

    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
}